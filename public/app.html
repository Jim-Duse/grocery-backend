<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grocery App</title>

  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="hidden">

<!-- Logout (intentionally outside card) -->
 <div class="logout_section">
   <div id="whoami" class="whoami"></div> <button id="logoutBtn" class="logout">Logout</button>
 </div>
  


  <!-- Global error -->
  <div id="error" class="error hidden"></div>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1>🧺 Grocery List123</h1>
    </header>

    <!-- Add item -->
    <section class="add-section">
      <form id="add-form">
        <input id="name" type="text" placeholder="Add an item..." required/>
        <input id="quantity" type="number" placeholder="Qty (optional)" min="1" />
        <button type="submit">Add item</button>
      </form>
    </section>

    <!-- List -->
    <section class="list" id="list">
      <!-- items injected here -->
       <ul id="items"></ul>
    </section>

  </div>
  

  <script src="/app.js"></script>
</body>
</html>
